schema_version: 2
assets: []
promotion_rule: >-
  An active asset needs a confirmed root cause, a verified prevention, bounded trigger and non-trigger, a verification method, and independent successful application in two real projects. Candidates are not automatically discovered or applied.
required_asset_fields:
  - id
  - state
  - source_record_ids
  - trigger
  - non_trigger
  - verification
  - owner
  - expiry
  - review_signal
  - retirement_condition
