schema_version: 1
package:
  id: chohogi
  name_ko: "초호기"
  name_hanja: "初號機"
  portability: "self-contained-method-assets"
  excludes:
    - "Codex Desktop plugins"
    - "MCP configuration and credentials"
    - "authentication, sessions, and caches"
    - "personal Codex config.toml"
components:
  - id: global-guidance
    organ: trunk
    source: assets/codex/AGENTS.md
    install: .codex/AGENTS.md
    trigger: "every Codex task"
    loader: "Codex global guidance"
  - id: conductor
    organ: trunk
    source: assets/agents/chohogi/trunk/conductor.md
    install: .agents/chohogi/trunk/conductor.md
    trigger: "substantial task intake"
    loader: "referenced by global guidance"
  - id: execution-allocation
    organ: trunk
    source: assets/agents/chohogi/trunk/execution-allocation.md
    install: .agents/chohogi/trunk/execution-allocation.md
    trigger: "after a daily route is selected"
    loader: "referenced by conductor and global guidance"
  - id: state-transition
    organ: trunk
    source: assets/agents/chohogi/trunk/state-transition.md
    install: .agents/chohogi/trunk/state-transition.md
    trigger: "daily route transition or maintenance handoff"
    loader: "referenced by conductor"
  - id: authority-lattice
    organ: trunk
    source: assets/agents/chohogi/trunk/authority-lattice.md
    install: .agents/chohogi/trunk/authority-lattice.md
    trigger: "persistent change, external effect, or global asset decision"
    loader: "referenced by conductor and execution allocation"
  - id: capability-selection
    organ: trunk
    source: assets/agents/chohogi/trunk/capability-selection.md
    install: .agents/chohogi/trunk/capability-selection.md
    trigger: "after flow and execution allocation when a native skill, external provider, or project leaf may be needed"
    loader: "referenced by conductor and global guidance"
  - id: skill-adoption
    organ: trunk
    source: assets/agents/chohogi/trunk/skill-adoption.md
    install: .agents/chohogi/trunk/skill-adoption.md
    trigger: "homeostasis review of an external skill, method bundle, or provider"
    loader: "referenced by homeostasis and capability selection"
  - id: context-packet
    organ: trunk
    source: assets/agents/chohogi/trunk/context-packet.md
    install: .agents/chohogi/trunk/context-packet.md
    trigger: "multi-boundary work or context-continuity risk"
    loader: "referenced by conductor"
  - id: xylem-context
    organ: vascular-bundle
    source: assets/agents/chohogi/trunk/vascular-bundle/xylem-context.md
    install: .agents/chohogi/trunk/vascular-bundle/xylem-context.md
    trigger: "substantial work needs grounded context handoff"
    loader: "referenced by conductor"
  - id: phloem-feedback
    organ: vascular-bundle
    source: assets/agents/chohogi/trunk/vascular-bundle/phloem-feedback.md
    install: .agents/chohogi/trunk/vascular-bundle/phloem-feedback.md
    trigger: "terminal delivery or debugging has confirmed prevention evidence"
    loader: "referenced by conductor and learning"
  - id: leaf-methods
    organ: leaves
    source: assets/agents/chohogi/trunk/leaf-methods.md
    install: .agents/chohogi/trunk/leaf-methods.md
    trigger: "after branch selection when a method choice is needed"
    loader: "referenced by conductor"
  - id: meristem-lifecycle
    organ: trunk
    source: assets/agents/chohogi/trunk/meristem-capability-lifecycle.md
    install: .agents/chohogi/trunk/meristem-capability-lifecycle.md
    trigger: "homeostasis review of a role or reusable-skill candidate"
    loader: "referenced by homeostasis"
  - id: daily-routes
    organ: trunk
    source: assets/agents/chohogi/trunk/routes
    install: .agents/chohogi/trunk/routes
    includes: [product-decision, delivery, debugging]
    trigger: "after conductor selects one daily route"
    loader: "referenced by global guidance and conductor"
  - id: route-evaluations
    organ: trunk
    source: assets/agents/chohogi/trunk/evals
    install: .agents/chohogi/trunk/evals
    trigger: "explicit route conformance or outcome comparison"
    loader: "not automatically loaded"
  - id: execution-evaluations
    organ: trunk
    source: assets/agents/chohogi/trunk/evals/execution-fixtures.json
    install: .agents/chohogi/trunk/evals/execution-fixtures.json
    trigger: "explicit execution-allocation conformance or outcome comparison"
    loader: "not automatically loaded"
  - id: capability-evaluations
    organ: trunk
    source: assets/agents/chohogi/trunk/evals/capability-fixtures.json
    install: .agents/chohogi/trunk/evals/capability-fixtures.json
    trigger: "explicit capability-boundary conformance or outcome comparison"
    loader: "not automatically loaded"
  - id: replay-result-schema
    organ: trunk
    source: assets/agents/chohogi/trunk/evals/replay-result.schema.json
    install: .agents/chohogi/trunk/evals/replay-result.schema.json
    trigger: "recording or reviewing real Chohogi replay evidence"
    loader: "not automatically loaded"
  - id: evaluation-budget-policy
    organ: trunk
    source: assets/agents/chohogi/trunk/evals/evaluation-budget-policy.md
    install: .agents/chohogi/trunk/evals/evaluation-budget-policy.md
    trigger: "homeostasis review of a global-policy candidate or explicit paired replay"
    loader: "referenced by homeostasis; not automatically loaded"
  - id: replay-evaluation-verifier
    organ: trunk
    source: tooling/verify-replay-evaluation.py
    install: tooling/verify-replay-evaluation.py
    trigger: "changing replay evidence schema, validation, or aggregation"
    loader: "manual repository verification"
  - id: constitution
    organ: roots
    source: assets/agents/chohogi/roots/constitution.md
    install: .agents/chohogi/roots/constitution.md
    trigger: "harness policy or installation change"
    loader: "referenced by conductor and branches"
  - id: learning
    organ: regulatory-processes
    source: assets/agents/skills/learning
    install: .agents/skills/learning
    trigger: "confirmed failure with prevention evidence"
    loader: "Codex skill discovery"
  - id: homeostasis
    organ: regulatory-processes
    source: assets/agents/skills/homeostasis
    install: .agents/skills/homeostasis
    trigger: "whole-harness health, lifecycle, or routing change"
    loader: "Codex skill discovery"
  - id: skill-lifecycle-reference
    organ: branches
    source: assets/agents/skills/homeostasis/references/skill-lifecycle.md
    install: .agents/skills/homeostasis/references/skill-lifecycle.md
    trigger: "after a reusable SKILL.md lifecycle decision"
    loader: "read by homeostasis; $skill-creator is preferred when callable"
  - id: reusable-leaves
    organ: leaves
    source: assets/agents/skills
    install: .agents/skills
    includes: [accessibility, core-web-vitals, grill-me, performance, react-async-state-safety, security-and-hardening]
    trigger: "only when the concrete technology boundary matches"
    loader: "Codex skill discovery"
  - id: reusable-skill-provenance
    organ: leaves
    source: assets/agents/chohogi/xylem/provenance.json
    install: .agents/chohogi/xylem/provenance.json
    trigger: "external-skill adoption, update, or reference-integrity review"
    loader: "referenced by homeostasis"
  - id: amyloplast
    organ: amyloplast
    source: assets/agents/chohogi/amyloplast
    install: .agents/chohogi/amyloplast
    trigger: "explicit learning or homeostasis review"
    loader: "not automatically loaded"
project_boundary:
  leaves_location: "<project>/.agents/skills and project-owned contracts/tests"
  ownership: "the project Git repository"
  rule: "Project learning stays in its project record unless promoted into amyloplast."
